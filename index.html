<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Hukum & UU Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white; padding: 2.5rem 1rem; text-align: center; }
        header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.4rem; }
        header p { color: #c7d2fe; font-size: 0.95rem; }

        .container { max-width: 800px; width: 92%; margin: -1.5rem auto 2rem auto; flex: 1; }
        .card { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        
        .api-input-group { margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px dashed #e2e8f0; }
        .api-input-group label { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 6px; }
        
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #4f46e5; }
        
        .search-box { display: flex; gap: 8px; margin-top: 8px; }
        button { padding: 12px 24px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        button:hover { background: #4338ca; }
        
        .result-box { background: white; border-radius: 12px; padding: 1.5rem; border: 1px solid #e2e8f0; line-height: 1.7; display: none; }
        .result-box h3 { color: #1e1b4b; margin-bottom: 0.75rem; border-bottom: 2px solid #eef2ff; padding-bottom: 0.5rem; }
        .loading { text-align: center; color: #6366f1; font-weight: 600; display: none; padding: 2rem; }
    </style>
</head>
<body>

    <header>
        <h1>🤖 AI Konsultan UU Digital</h1>
        <p>Tanyakan masalah hukum atau undang-undang apa saja di Indonesia</p>
    </header>

    <div class="container">
        <div class="card">
            <!-- Tempat Masukin API Key -->
            <div class="api-input-group">
                <label>API Key Gemini (Google AI Studio):</label>
                <input type="password" id="apiKeyInput" placeholder="Tempel API Key dari Google AI Studio di sini...">
            </div>

            <!-- Kolom Pertanyaan -->
            <label style="font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Pertanyaan / Cari Pasal:</label>
            <div class="search-box">
                <input type="text" id="userInput" placeholder="Contoh: Apa bunyi UU ITE pencemaran nama baik? Atau curhat kasus..." onkeyup="if(event.key==='Enter') askAI()">
                <button onclick="askAI()">Tanya AI</button>
            </div>
        </div>

        <div class="loading" id="loadingState">⏳ AI sedang mencari pasal dan menganalisis undang-undang...</div>
        
        <div class="result-box" id="resultContainer">
            <h3>Hasil Analisis & Pasal Hukum:</h3>
            <div id="aiResponse"></div>
        </div>
    </div>

    <script>
        async function askAI() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const prompt = document.getElementById('userInput').value.trim();
            const loading = document.getElementById('loadingState');
            const resultBox = document.getElementById('resultContainer');
            const aiResponse = document.getElementById('aiResponse');

            if (!apiKey) {
                alert("Masukkan API Key Gemini kamu dulu ya!");
                return;
            }
            if (!prompt) {
                alert("Ketik pertanyaan hukum atau pasal yang mau dicari!");
                return;
            }

            loading.style.display = 'block';
            resultBox.style.display = 'none';

            const systemInstruction = "Kamu adalah ahli hukum Indonesia. Jawab pertanyaan pengguna dengan sebutkan nama Undang-Undang, nomor pasal, beserta penjelasan hukum ringkas yang mudah dipahami. Fokus pada hukum di Republik Indonesia.";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `${systemInstruction}\n\nPertanyaan Pengguna: ${prompt}` }]
                        }]
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let textResult = data.candidates[0].content.parts[0].text;
                    // Format teks sederhana
                    textResult = textResult.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    aiResponse.innerHTML = textResult;
                    resultBox.style.display = 'block';
                } else {
                    alert("Gagal mengambil data dari AI. Cek API Key kamu!");
                }
            } catch (error) {
                loading.style.display = 'none';
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>
